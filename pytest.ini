# pytest.ini — PhantomX test configuration
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    -q
timeout = 30
markers =
    slow: mark test as slow (deselect with -m "not slow")
    integration: mark as integration test
    smoke: mark as smoke test

# ── Coverage settings ────────────────────────────────────────────────────────
[coverage:run]
source = .
omit =
    tests/*
    */__init__.py
    dashboard/*
    .github/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if verbose:
    if __name__ == .__main__.:
    raise NotImplementedError
    pass
show_missing = True
skip_covered = False
